name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------
  # JOB 1: Build the Executables
  # ---------------------------------------------------------
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: >
          pyinstaller --onefile --windowed 
          --name AudiobookReader-${{ runner.os }} 
          --collect-all shiboken6 
          --collect-all piper 
          --collect-all espeakng_loader 
          Audiobook/application.py

      - name: Zip Linux Executable
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip AudiobookReader-Linux.zip AudiobookReader-Linux

      - name: Zip Windows Executable
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path AudiobookReader-Windows.exe -DestinationPath AudiobookReader-Windows.zip

      # Upload to a temporary holding area (Artifacts)
      - name: Upload Artifact to Holding Area
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ runner.os }}
          path: dist/AudiobookReader-*.zip
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 2: Publish the Release
  # ---------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build # Waits for both Linux and Windows to finish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts from Holding Area
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # Combines Windows and Linux zips into one folder

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}