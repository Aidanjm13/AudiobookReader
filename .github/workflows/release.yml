name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a v* tag

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        # --onefile packages everything into a single clean executable
        # --windowed hides the background terminal
        run: >
          pyinstaller --onefile --windowed 
          --name AudiobookReader-${{ runner.os }} 
          --collect-all shiboken6 
          --collect-all piper 
          --collect-all espeakng_loader 
          Audiobook/application.py

      - name: Zip Linux Executable
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip AudiobookReader-Linux.zip AudiobookReader-Linux

      - name: Zip Windows Executable
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path AudiobookReader-Windows.exe -DestinationPath AudiobookReader-Windows.zip

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudiobookReader-${{ runner.os }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}