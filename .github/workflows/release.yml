name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-20.04 ensures the Linux build works on older and newer distros
        os: [ubuntu-20.04, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      # Audio libraries on Linux require this system package to compile correctly
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      # --windowed hides the console prompt for your GUI app
      run: pyinstaller --windowed --name AudiobookReader-windows Audiobook/application.py

    - name: Zip the Windows Build
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist/AudiobookReader-windows/* -DestinationPath dist/AudiobookReader-windows.zip

    - name: Build with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: pyinstaller --windowed --name AudiobookReader-linux Audiobook/application.py

    - name: Zip the Linux Build
      if: runner.os == 'Linux'
      run: |
        cd dist
        zip -r AudiobookReader-linux.zip AudiobookReader-linux/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/AudiobookReader-windows.zip
          dist/AudiobookReader-linux.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}